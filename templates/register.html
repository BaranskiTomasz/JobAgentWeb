<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobAgentWeb — Register</title>
<link rel="stylesheet" href="/static/dashboard.css">
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card panel">
    <div class="auth-intro">
      <div class="wordmark">JobAgent<span class="dot">.</span></div>
      <p>Create an account to start reviewing your job pool here. Running the collector and scoring pipeline itself still happens from your own machine, using the local JobAgent tool.</p>
    </div>

    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

    <form method="post" action="/register">
      <div class="auth-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username" minlength="3">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
      </div>
      <div class="auth-field">
        <label for="password_confirm">Confirm password</label>
        <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn-primary auth-submit">Register</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="/login">Log in</a></div>
  </div>
</div>

</body>
</html>
